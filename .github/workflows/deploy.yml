name: Deploy to Prod VPS

on:
  push:
    branches: [ main ] # Akan trigger otomatis saat ada push ke branch main
  # PR dijalankan supaya job `test` sudah terbukti hijau SEBELUM merge, bukan
  # baru ketahuan saat kodenya sedang dalam perjalanan ke produksi.
  #
  # Konsekuensinya harus disadari: sejak baris ini ada, workflow ini bisa
  # berjalan tanpa push ke `main`. Job deploy karena itu dipagari
  # `if: github.event_name == 'push' && github.ref == 'refs/heads/main'`.
  # Tanpa pagar itu, membuka PR akan men-deploy ke VPS produksi — secretnya
  # tersedia karena cabangnya ada di repositori yang sama.
  pull_request:
    branches: [ main ]

jobs:
  # Gerbang sebelum apa pun menyentuh mesin produksi.
  #
  # Sebelumnya tidak ada satu pun uji yang berjalan di alur ini: push ke `main`
  # langsung menjadi `git reset --hard` plus `pm2 reload` di mesin produksi. Kesalahan
  # penyuntikan dependensi tidak terlihat `tsc` dan baru muncul saat Nest
  # membangun container — artinya seluruh API mati, dan diketahuinya setelah
  # rilis. `app.module.spec.ts` menangkap hal itu dalam hitungan detik.
  #
  # Ujinya sengaja dijalankan di runner, bukan lewat SSH di VPS. Mesin produksi
  # punya `.env` produksi; menjalankan uji di sana berarti menaruh kode uji satu
  # langkah dari basis data sungguhan tanpa alasan.
  test:
    name: Uji
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Tanpa kata sandi: `scripts/setup-test-db.sh` menyusun URL tanpa
          # kata sandi, dan basis data ini hidup selama satu job lalu dibuang.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # `prisma.config.ts` membaca DIRECT_URL/DATABASE_URL saat CLI dipanggil,
      # termasuk oleh `prisma generate` di postinstall. Nilai ini tidak pernah
      # dihubungi; yang dipakai uji integrasi adalah TEST_DATABASE_URL.
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Klien Prisma dihasilkan otomatis oleh postinstall.
      - name: Pasang dependensi
        run: pnpm install --frozen-lockfile

      - name: Periksa tipe
        run: pnpm exec tsc -p tsconfig.build.json --noEmit

      # `lint` tidak lagi memakai `--fix`, jadi hasilnya berarti di sini.
      # Untuk memperbaiki otomatis di mesin sendiri: `pnpm run lint:fix`.
      - name: Lint
        run: pnpm run lint

      - name: Uji satuan
        run: pnpm test

      - name: Siapkan basis data uji
        run: pnpm run test:e2e:setup

      - name: Uji integrasi
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/tolongin_test
        run: pnpm exec jest --config ./test/jest-e2e.json

  # Job `deploy-vps1` dihapus pada 2026-08-03.
  #
  # Mesinnya sudah tidak aktif. Jejaknya: path `~/homelab/projects/...` menunjuk
  # mesin homelab, bukan VPS; dijangkau lewat Tailscale, sementara tailnet hanya
  # berisi dua laptop pemilik dan yang berlabel linux sudah offline berhari-hari;
  # dan IP publik yang tercatat di known_hosts lokal sudah didaur ulang penyedia
  # ke pelanggan lain — seluruh host key-nya berganti.
  #
  # Selama masih ada, job ini gagal pada setiap push dan menandai seluruh
  # workflow merah walau penyebaran ke mesin yang hidup berhasil.
  #
  # Langkah `Connect to Tailscale` ikut dibuang: hanya job ini yang memakainya.
  # Secret yang kini menganggur dan boleh dihapus dari repo:
  # VPS2_IP, VPS2_USER, VPS2_SSH_KEY, TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET.

  deploy:
    name: Deploy ke VPS (Sumapod)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Eksekusi SSH dan Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # 1. Pindah ke folder project
            cd ~/backend-tolongin
            
            # 2. Load NVM agar Node, pnpm, dan PM2 otomatis dikenali
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            
            # 3. Paksa Git untuk membuang perubahan lokal dan ambil kode terbaru
            git fetch --all
            git reset --hard origin/main
            git pull origin main
            
            # 4. Install dependencies menggunakan pnpm
            pnpm install --frozen-lockfile

            # 5. Generate ulang Prisma Client (WAJIB)
            pnpm exec prisma generate

            # 5b. Terapkan migrasi yang belum berjalan.
            #
            # Migrasi punya satu pintu. Ketika masih ada dua job deploy,
            # keduanya menunjuk basis data Supabase yang sama dan menjalankan
            # ini berbarengan berarti balapan terhadap satu tabel
            # `_prisma_migrations`. Job kedua kini sudah dihapus, tetapi
            # aturannya tetap: kalau nanti ada mesin kedua, langkah ini tidak
            # ikut disalin ke sana.
            #
            # Sebelum baris ini ada, `deploy.yml` tidak pernah menjalankan
            # migrasi sama sekali — hanya `prisma generate` — sehingga skema
            # produksi diurus manual dan selisihnya tidak pernah diketahui.
            # Prasyaratnya sudah diperiksa pada 2026-08-03: `0_init` tercatat
            # sebagai applied, kelima migrasi tercatat, dan `migrate diff`
            # terhadap basis data mengembalikan selisih kosong.
            pnpm exec prisma migrate deploy

            # 6. Jalankan pnpm run build untuk membangun aplikasi
            pnpm run build
            
            # 7. Restart aplikasi menggunakan PM2 Ecosystem Config
            pm2 reload ecosystem.config.js --env production --update-env || pm2 start ecosystem.config.js --env production